services:
  avito:
    build: .
    image: avito-perekup
    container_name: avito-bot
    restart: unless-stopped
    environment:
      AVITO_BOT_TOKEN: ${AVITO_BOT_TOKEN:?задай токен в .env}
      AVITO_OWNER_ID: ${AVITO_OWNER_ID:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Обход блокировки Telegram. На Авито не влияет - он читается напрямую.
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      TELEGRAM_BASE_URL: ${TELEGRAM_BASE_URL:-}
      TELEGRAM_TIMEOUT: ${TELEGRAM_TIMEOUT:-30}
      AVITO_DB: /data/avito.db
      # Запуск монитора без кнопок: нужен, пока опрос Telegram нестабилен.
      # Кнопка «🟢 Включить» делает то же самое, но требует живого опроса.
      AVITO_ENABLED: ${AVITO_ENABLED:-}
      AVITO_OWNER_CHAT: ${AVITO_OWNER_CHAT:-}
      AVITO_MAX_PRICE: ${AVITO_MAX_PRICE:-5000}
      AVITO_REGION: ${AVITO_REGION:-krasnodar}
      AVITO_PROXY: ${AVITO_PROXY:-}
      TZ: Europe/Moscow
    volumes:
      - ./data:/data
    # Закрепляем адрес Telegram по IPv4. Иначе на серверах, где IPv6 настроен
    # но не работает, имя api.telegram.org разрешается в адрес вида 2001:...,
    # соединение уходит в никуда и бот виснет на старте без ошибки.
    # Свой адрес можно подставить через TELEGRAM_IPV4 в .env, если этот
    # перестанет отвечать: узнать его - getent ahostsv4 api.telegram.org
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_IPV4:-149.154.167.220}"
